plugins {
    id "java"
    id "net.neoforged.moddev" version "2.0.140"
}

group = "dev.serhii.numiaerobridge"
version = "0.2.4"

base {
    archivesName = "Numismatics-Aeronautics-Bridge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()

    maven {
        name = "Create"
        url = "https://maven.createmod.net"
    }

    maven {
        name = "Sponge"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument "--nogui"
        }
    }

    mods {
        numiaerobridge {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Create API
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }

    // Numismatics API (mod is still installed separately in the game)
    compileOnly("maven.modrinth:Jdbbtt0i:${numismatics_version_id}")

    // Ponder API for the Docking Connector tutorial page
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")

    // Mixin annotations and processor for the Docking Connector integration
    compileOnly("org.spongepowered:mixin:0.8.5")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    // The mixin targets a class supplied by the installed Aeronautics bundle.
    // All target access is remapped=false and performed by string/reflection.
    options.compilerArgs.add("-proc:none")
}

tasks.named("jar", Jar).configure {
    manifest {
        attributes(
            "Implementation-Version": project.version,
            "Specification-Version": project.version
        )
    }
}
