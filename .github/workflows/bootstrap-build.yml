name: Build Creative Tab Organizer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Prepare distributable
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/CreativeTabOrganizer-beta-1.0.3.jar

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: CreativeTabOrganizer-beta-1.0.3
          path: dist/CreativeTabOrganizer-beta-1.0.3.jar
          if-no-files-found: error
          retention-days: 14
