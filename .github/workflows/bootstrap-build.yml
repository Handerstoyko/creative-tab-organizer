name: Build Creative Tab Organizer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore project sources
        run: |
          mkdir -p /tmp/creative-tab-organizer
          base64 --decode creative-tab-organizer.tar.gz.b64 | tar -xz -C /tmp/creative-tab-organizer
          cp -a /tmp/creative-tab-organizer/creative-tab-organizer/. .
          rm -f creative-tab-organizer.tar.gz.b64

      - name: Inspect current Java sources
        run: |
          find src/main/java/com/example/taborganizer -type f -name '*.java' -print
          for f in $(find src/main/java/com/example/taborganizer -type f -name '*.java' | sort); do
            echo "===== SOURCE: $f ====="
            cat "$f"
          done

      - name: Normalize NeoGradle Mixin setup
        run: |
          sed -i "/id 'net.neoforged.gradle.mixin' version/d" build.gradle
          sed -i '/^mixin {$/,/^}$/d' build.gradle
          sed -i '/"refmap":/d' src/main/resources/taborganizer.mixins.json
          sed -i 's/@Mixin(CreativeModeInventoryScreen.class)/@Mixin(value = CreativeModeInventoryScreen.class, remap = false)/' src/main/java/com/example/taborganizer/mixin/CreativeModeInventoryScreenMixin.java
          sed -i 's/@Mixin(CreativeModeTabRegistry.class)/@Mixin(value = CreativeModeTabRegistry.class, remap = false)/' src/main/java/com/example/taborganizer/mixin/CreativeModeTabRegistryMixin.java
          sed -i 's/@Mixin(CreativeModeInventoryScreen.class)/@Mixin(value = CreativeModeInventoryScreen.class, remap = false)/' src/main/java/com/example/taborganizer/mixin/accessor/CreativeModeInventoryScreenAccessor.java
          sed -i 's/@Mixin(CreativeModeTab.class)/@Mixin(value = CreativeModeTab.class, remap = false)/' src/main/java/com/example/taborganizer/mixin/accessor/CreativeModeTabAccessor.java
          sed -i 's/@Mixin(ClientPacketListener.class)/@Mixin(value = ClientPacketListener.class, remap = false)/' src/main/java/com/example/taborganizer/mixin/accessor/ClientPacketListenerAccessor.java
          sed -i 's/@Accessor("row")/@Accessor(value = "row", remap = false)/' src/main/java/com/example/taborganizer/mixin/accessor/CreativeModeTabAccessor.java
          sed -i 's/@Accessor("column")/@Accessor(value = "column", remap = false)/' src/main/java/com/example/taborganizer/mixin/accessor/CreativeModeTabAccessor.java
          sed -i 's/@Accessor("selectedTab")/@Accessor(value = "selectedTab", remap = false)/' src/main/java/com/example/taborganizer/mixin/accessor/CreativeModeInventoryScreenAccessor.java
          sed -i 's/@Accessor("displayOperatorCreativeTab")/@Accessor(value = "displayOperatorCreativeTab", remap = false)/' src/main/java/com/example/taborganizer/mixin/accessor/CreativeModeInventoryScreenAccessor.java
          sed -i 's/@Accessor("enabledFeatures")/@Accessor(value = "enabledFeatures", remap = false)/' src/main/java/com/example/taborganizer/mixin/accessor/ClientPacketListenerAccessor.java
          python3 - <<'PY'
          from pathlib import Path

          base = Path("src/main/java/com/example/taborganizer")
          accessors = base / "mixin/accessor"

          (accessors / "CreativeModeInventoryScreenAccessor.java").write_text("""package com.example.taborganizer.mixin.accessor;

          import net.minecraft.client.gui.screens.inventory.CreativeModeInventoryScreen;
          import net.minecraft.world.item.CreativeModeTab;
          import net.neoforged.neoforge.client.gui.CreativeTabsScreenPage;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.gen.Accessor;
          import java.util.List;

          @Mixin(value = CreativeModeInventoryScreen.class, remap = false)
          public interface CreativeModeInventoryScreenAccessor {
              @Accessor(value = "selectedTab", remap = false)
              static CreativeModeTab taborganizer$getSelectedTab() {
                  throw new AssertionError("Mixin accessor");
              }

              @Accessor(value = "displayOperatorCreativeTab", remap = false)
              boolean taborganizer$getDisplayOperatorCreativeTab();

              @Accessor(value = "pages", remap = false)
              List<CreativeTabsScreenPage> taborganizer$getPages();
          }
          """)

          (accessors / "AbstractContainerScreenAccessor.java").write_text("""package com.example.taborganizer.mixin.accessor;

          import net.minecraft.client.gui.screens.inventory.AbstractContainerScreen;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.gen.Accessor;

          @Mixin(value = AbstractContainerScreen.class, remap = false)
          public interface AbstractContainerScreenAccessor {
              @Accessor(value = "leftPos", remap = false)
              int taborganizer$getLeftPos();

              @Accessor(value = "topPos", remap = false)
              int taborganizer$getTopPos();

              @Accessor(value = "imageWidth", remap = false)
              int taborganizer$getImageWidth();
          }
          """)

          (accessors / "ScreenAccessor.java").write_text("""package com.example.taborganizer.mixin.accessor;

          import net.minecraft.client.gui.components.Renderable;
          import net.minecraft.client.gui.components.events.GuiEventListener;
          import net.minecraft.client.gui.narration.NarratableEntry;
          import net.minecraft.client.gui.screens.Screen;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.gen.Invoker;

          @Mixin(value = Screen.class, remap = false)
          public interface ScreenAccessor {
              @Invoker(value = "addRenderableWidget", remap = false)
              <T extends GuiEventListener & Renderable & NarratableEntry> T taborganizer$addRenderableWidget(T widget);
          }
          """)

          mixin = base / "mixin/CreativeModeInventoryScreenMixin.java"
          source = mixin.read_text()
          source = source.replace(
              "import com.example.taborganizer.mixin.accessor.CreativeModeInventoryScreenAccessor;",
              "import com.example.taborganizer.mixin.accessor.CreativeModeInventoryScreenAccessor;\n"
              "import com.example.taborganizer.mixin.accessor.AbstractContainerScreenAccessor;\n"
              "import com.example.taborganizer.mixin.accessor.ScreenAccessor;"
          )
          source = source.replace(
              "        CreativeModeInventoryScreenAccessor accessor = (CreativeModeInventoryScreenAccessor) (Object) this;\n"
              "        List<CreativeTabsScreenPage> pages = accessor.taborganizer$getPages();",
              "        CreativeModeInventoryScreenAccessor accessor = (CreativeModeInventoryScreenAccessor) (Object) this;\n"
              "        AbstractContainerScreenAccessor containerAccessor = (AbstractContainerScreenAccessor) (Object) this;\n"
              "        ScreenAccessor screenAccessor = (ScreenAccessor) (Object) this;\n"
              "        List<CreativeTabsScreenPage> pages = accessor.taborganizer$getPages();"
          )
          source = source.replace("accessor.taborganizer$addRenderableWidget(", "screenAccessor.taborganizer$addRenderableWidget(")
          source = source.replace("accessor.taborganizer$getLeftPos()", "containerAccessor.taborganizer$getLeftPos()")
          source = source.replace("accessor.taborganizer$getTopPos()", "containerAccessor.taborganizer$getTopPos()")
          source = source.replace("accessor.taborganizer$getImageWidth()", "containerAccessor.taborganizer$getImageWidth()")
          mixin.write_text(source)

          config = Path("src/main/resources/taborganizer.mixins.json")
          text = config.read_text()
          needle = '    "accessor.CreativeModeInventoryScreenAccessor",'
          replacement = needle + '\n    "accessor.AbstractContainerScreenAccessor",\n    "accessor.ScreenAccessor",'
          if "accessor.AbstractContainerScreenAccessor" not in text:
              if needle not in text:
                  raise SystemExit("Could not find mixin config insertion point")
              text = text.replace(needle, replacement, 1)
          config.write_text(text)
          PY
          sed -i 's/ClientHooks.getPageButtonComponent(true)/Component.literal("<")/' src/main/java/com/example/taborganizer/mixin/CreativeModeInventoryScreenMixin.java
          sed -i 's/ClientHooks.getPageButtonComponent(false)/Component.literal(">")/' src/main/java/com/example/taborganizer/mixin/CreativeModeInventoryScreenMixin.java
          sed -i '/import net.neoforged.neoforge.client.ClientHooks;/d' src/main/java/com/example/taborganizer/mixin/CreativeModeInventoryScreenMixin.java

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Prepare distributable
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/CreativeTabOrganizer-beta-1.0.3.jar

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: CreativeTabOrganizer-beta-1.0.3
          path: dist/CreativeTabOrganizer-beta-1.0.3.jar
          if-no-files-found: error
          retention-days: 14
