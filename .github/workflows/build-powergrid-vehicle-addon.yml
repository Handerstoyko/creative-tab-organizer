name: Build Power Grid Vehicle Addon

on:
  push:
    branches:
      - powergrid-vehicle-addon
    paths:
      - 'powergrid-vehicle-addon/**'
      - 'powergrid-vehicle-addon-source-part*.b64'
      - '.github/workflows/build-powergrid-vehicle-addon.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore addon source archive
        shell: bash
        run: |
          set -euo pipefail
          cat powergrid-vehicle-addon-source-part*.b64 | base64 --decode | tar -xz
          mv pg_vehicle_addon powergrid-vehicle-addon
          rm -f powergrid-vehicle-addon-source-part*.b64

      - name: Add Architectury Maven repository
        working-directory: powergrid-vehicle-addon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build.gradle")
          source = path.read_text()
          anchor = next(line for line in source.splitlines() if "maven.createmod.net" in line)
          if "maven.architectury.dev" not in source:
              source = source.replace(anchor, anchor + chr(10) + "    maven { url = 'https://maven.architectury.dev/' }", 1)
          path.write_text(source)
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build mod
        working-directory: powergrid-vehicle-addon
        run: gradle --no-daemon clean build

      - name: Verify and stage JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find powergrid-vehicle-addon/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$jar_file"
          unzip -l "$jar_file" | grep -q 'META-INF/neoforge.mods.toml'
          mkdir -p dist
          cp "$jar_file" dist/PG-Vehicle-Addon-0.1.0.jar
          sha256sum dist/PG-Vehicle-Addon-0.1.0.jar | tee dist/SHA256SUMS.txt

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: PG-Vehicle-Addon-0.1.0
          path: dist/*
          if-no-files-found: error
          retention-days: 14
